<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vlogs | Rajil Tiwari</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'index' %}">Rajil Tiwari</a>
            <div>
                <a href="{% url 'index' %}" class="nav-link text-white d-inline mx-2">Home</a>
                <a href="{% url 'vlog_list' %}" class="nav-link text-white d-inline mx-2">Vlogs</a>
                <a href="/admin/" class="btn btn-outline-light btn-sm ms-3">Admin Login</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="fw-bold mb-4 text-center">All Vlogs</h2>
        <div class="row">
            {% for vlog in vlogs %}
            <div class="col-md-4 mb-4">
                <div class="card h-100 shadow-sm border-0">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">{{ vlog.title }}</h5>
                        <p class="card-text text-muted">{{ vlog.description }}</p>
                        <a href="{{ vlog.video_url }}" target="_blank" class="btn btn-primary btn-sm">Watch Video</a>
                    </div>
                    <div class="card-footer bg-white text-muted small">
                        Added on: {{ vlog.created_at|date:"M d, Y" }}
                    </div>
                </div>
            </div>
            {% empty %}
            <div class="col-12 text-center">
                <p class="text-muted">No vlogs added yet.</p>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
